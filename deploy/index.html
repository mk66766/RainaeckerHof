<style>
:root{
  color-scheme: light;
  --bg:#EDF1E8; --surface:#FFFFFF; --ink:#1E2A22; --muted:#66746B; --line:#D5DDCF;
  --yolk:#F4B400; --yolk-ink:#2B2000; --barn:#2D5B88; --good:#2E7D4F; --bad:#B3402F; --c-in:#2563A8; --c-out:#C8691C;

  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141A16; --surface:#1E2721; --ink:#EAF0E6; --muted:#9AA99F; --line:#2E3A32;
    --yolk:#F4B400; --yolk-ink:#2B2000; --barn:#7DB2E3; --good:#6CC28D; --bad:#F0907F; --c-in:#4A8BCB; --c-out:#C9772E;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translate(-50%,-60px);opacity:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;z-index:15;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}

:root{padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

.top h1{font-size:clamp(18px,6.1vw,26px);white-space:nowrap;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--barn);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.yolk{background:var(--yolk);color:var(--yolk-ink)}
button.small{padding:6px 10px;font-size:14px;border-radius:9px}

.projects button.on{background:var(--ink);color:var(--bg)}
.egg{width:160px;height:198px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:var(--yolk);color:var(--yolk-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;box-shadow:inset -10px -14px 0 rgba(0,0,0,.08);transition:transform .12s;padding:0}
.egg:active{transform:scale(.95)}

.hero{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;position:relative}
.duty{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;line-height:1.2;padding:4px 8px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);white-space:nowrap;z-index:1}
.duty span{font-size:12px;color:var(--muted)}
.duty b{font-size:14px}
.duty.mine{border:2px solid var(--yolk);padding:3.5px 7.5px}

.herofoot{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.weekcount{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}

.stock{display:flex;align-items:baseline;gap:8px}
.big{font-family:var(--head);font-weight:800;font-size:36px;line-height:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}

.bar span{font-size:14px;color:var(--muted)}
.bar b{font-size:14px}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--yolk);color:var(--yolk-ink);font-size:14px;font-weight:600}
.weeknav{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}.weeknav .muted{font-size:14px}
.now{border:2px solid var(--yolk)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-weight:500}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--good);flex:none;padding:0}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--yolk);border-radius:99px}
.meter i.full{background:var(--good)}
.paychip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.pc{font-size:14px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pc.warn{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.pc.info{background:var(--bg);color:var(--ink)}
.pc.good{color:var(--good);border-color:var(--good)}
.pc.bad{background:#C0392B;color:#fff;border-color:#C0392B}

.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;width:100%;max-width:380px;box-shadow:0 14px 44px rgba(0,0,0,.4)}
.dlg .tag{display:inline-block;margin-bottom:10px;padding:3px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.dlg h3{font-size:20px;margin:0 0 8px;line-height:1.2}
.dlg p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.dlg .btns{display:flex;gap:10px;margin-top:20px}
.dlg .btns button{flex:1}
button.danger{background:#C0392B;color:#fff}
.mem{display:flex;align-items:center;gap:12px;padding:6px 0}
.ph{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line);cursor:pointer}
.ph-big{width:100%;max-height:70vh;object-fit:contain;border-radius:12px}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:3px;width:100%}
.wk{height:50px;border-radius:10px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;line-height:1.15;min-width:0;overflow:hidden}
.wk b{font-size:12px}
.wk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk.mine{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.wk.cur{border-width:2px;border-color:var(--ink)}
.wk.pre{opacity:.3;font-weight:600}
.man-sec{border-top:1px solid var(--line);padding:11px 0}
.man-sec>summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.man-sec>summary::-webkit-details-marker{display:none}
.man-sec>summary::after{content:'+';font-size:22px;line-height:1;color:var(--muted)}
.man-sec[open]>summary::after{content:'–'}
.man-sec ul{margin:8px 0 0;padding-left:20px}
.man-sec li{margin:7px 0;line-height:1.45}
details.card>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'›';font-size:24px;line-height:1;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-90deg)}
.calh{font-size:14px;color:var(--muted);text-align:center;padding:2px 0}
.day{position:relative;height:50px;min-width:0;overflow:hidden;border-radius:10px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-weight:500;font-size:14px}
.day.today{border-color:var(--yolk);border-width:2px}
.day .eg{font-size:12px;background:var(--yolk);color:var(--yolk-ink);border-radius:99px;padding:0 6px;margin-top:2px;font-weight:700}
.day .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--barn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--muted);border-radius:10px;padding:8px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button{position:relative}
nav button svg{width:24px;height:24px}
:root[data-proj="goats"]{--yolk:#7DB548;--yolk-ink:#132300}
.projects button.on{background:var(--yolk);color:var(--yolk-ink)}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.hi{margin-right:7px}
.eier{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ei{width:17px;height:22px;fill:none;stroke:var(--muted);stroke-width:.8}
.ei.on{fill:var(--yolk);stroke:var(--yolk)}
.egg{background:radial-gradient(ellipse at 33% 24%, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 30%), var(--yolk);box-shadow:0 14px 24px -10px rgba(0,0,0,.45), inset -10px -14px 0 rgba(0,0,0,.08)}
@keyframes hop{0%{transform:scale(1)}35%{transform:scale(.92)}70%{transform:scale(1.05) translateY(-5px)}100%{transform:none}}
@keyframes pop{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.egg.hop{animation:hop .35s ease-out}
.egg .n.pop{display:inline-block;animation:pop .3s ease-out}
.herd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goat{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 10px}
.gph{width:96px;height:96px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:46px;border:3px solid var(--yolk)}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.goat .muted{font-size:14px}
.empty.rich{padding:18px 8px}
.empty.rich .ill{font-size:46px;line-height:1;margin-bottom:8px}
.empty.rich p{margin:0 auto;max-width:320px}
.empty.rich button{margin-top:12px}
.mbars{display:flex;gap:6px;height:130px;align-items:flex-end;margin-top:6px}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:4px;background:none;border:0;padding:0;border-radius:8px;color:var(--muted)}
.mb.on{background:var(--bg)}
.mbb{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}
.mbb i{display:block;width:38%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}
.mb span{font-size:13px}
.c-in{background:var(--c-in)}.c-out{background:var(--c-out)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.egg.hop,.egg .n.pop{animation:none}}
.step{display:flex;gap:8px;align-items:stretch}
.step input{flex:1;text-align:center;font-size:20px;font-weight:600;min-width:0}
.step button{flex:none;width:56px;font-size:26px;line-height:1;padding:0}
details.info{margin-top:10px}
details.info>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:14px;display:inline-block;padding:4px 0}
details.info>summary::-webkit-details-marker{display:none}
details.info[open]>summary{margin-bottom:4px}
.dutynote{border:2px solid var(--yolk);padding:12px 16px}
.nbadge{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:#D9534F;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
nav button[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--yolk) 28%,transparent)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions button{flex:1}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.toast.undo{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;z-index:40;max-width:94vw}
.toast.undo button{background:var(--yolk);color:var(--yolk-ink);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;flex:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.egg{transition:none}}

<script>
/* ================= Konfiguration ================= */
const CONFIG = {
  site: 'https://rainaecker-hof-rtti.netlify.app',   // öffentliche Adresse der App (für Links an Nachbarn)
  vapid: 'BKF7p8XG9bboFdHUdTy_DXbnh7trO0eqvfRyZi8_RyuhXkxxhODqyyJcCxCwYHzr6nYYGTXrbRMz-U8K9iVKJOk',   // öffentlicher Push-Schlüssel (der private liegt nur in der Datenbank)
  url: 'https://ubboukewvvrriraxfuzn.supabase.co',
  // öffentlicher Schlüssel (anon), darf im Browser stehen. Geschützt wird über die Zugriffsregeln in der Datenbank.
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViYm91a2V3dnZycmlyYXhmdXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzI0MjIsImV4cCI6MjEwNzcwODQyMn0.iNEwD9cybcurN-TLWdsVsjV5KrjfHYW0AMIDgt61r1s',
  families: [
    {name:'Bader',    email:'bader@huehner.local', until:'2026-10-26'},   // noch dabei bis einschließlich KW 43, ausgetreten ab KW 44 (Mo 26.10.2026)
    {name:'Hatesaul', email:'hatesaul@huehner.local'},
    {name:'Kaufmann', email:'kaufmann@huehner.local'},
    {name:'Stopfer',  email:'stopfer@huehner.local'}
  ]
};
if(typeof supabase === 'undefined'){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Keine Verbindung</h2><p class="muted">Die Supabase-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.</p></div>';
  throw new Error('supabase-js nicht geladen');
}
const sb = supabase.createClient(CONFIG.url, CONFIG.key);

/* ================= Zustand ================= */
let S = {user:null, me:null, admin:false, fams:[], projects:[], cur:null, p:null};
// Darstellung je Handy: automatisch (wie das Handy), immer hell oder immer dunkel
const themeNow = () => { try{ const t = localStorage.getItem('hof-theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }catch(e){ return 'auto'; } };
function applyTheme(t){ if(t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; }
function setTheme(t){ try{ if(t === 'auto') localStorage.removeItem('hof-theme'); else localStorage.setItem('hof-theme', t); }catch(e){} applyTheme(t); render(); }
applyTheme(themeNow());
const P = () => S.p;
const isHens = () => S.p.kind === 'hens';

/* ================= Helfer ================= */
const uid = () => {
  if(crypto.randomUUID) return crypto.randomUUID();      // nur in sicheren Kontexten (https, localhost) vorhanden
  const b = crypto.getRandomValues(new Uint8Array(16));   // Ersatz: gültige UUID v4, z. B. bei http://192.168.x.x
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
};
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num = v => { const x = parseFloat(String(v).replace(',','.')); return isNaN(x) ? 0 : x; };
const sum = (arr, f) => arr.reduce((a,x)=>a+f(x),0);
const fam = id => (!id || id === 'kasse') ? {name:'Gemeinschaftskasse'} : (S.fams.find(f => f.id === id) || {name:'?'});
const members = () => P().members.map(id => S.fams.find(f => f.id === id)).filter(Boolean);
const defFam = () => P().members.includes(S.me) ? S.me : P().members[0];
const famOptions = sel => members().map(f => `<option value="${f.id}" ${f.id===(sel||defFam())?'selected':''}>${esc(f.name)}</option>`).join('');
function toast(t){ const e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2200); }
// Meldung mit Knopf „Rückgängig“ (5 Sekunden), macht den letzten Schritt wieder rückgängig
function toastUndo(t, undo){
  document.querySelectorAll('.toast.undo').forEach(x => x.remove());
  const e = document.createElement('div'); e.className = 'toast undo'; e.setAttribute('role', 'status');
  e.innerHTML = `<span></span><button type="button">Rückgängig</button>`; e.firstChild.textContent = t;
  e.querySelector('button').onclick = () => { e.remove(); closeSheet(); run(undo, 'Rückgängig gemacht'); };
  document.body.appendChild(e); setTimeout(() => e.remove(), 5000);
}
const parseD = s => new Date(s + 'T12:00');
const fmtDay = d => d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
const fmtDate = s => parseD(s).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});
const daysSince = s => Math.floor((parseD(today()) - parseD(s)) / 864e5);
function monday(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekNo(m){ return Math.round((Date.UTC(m.getFullYear(),m.getMonth(),m.getDate())-Date.UTC(2024,0,1))/(7*864e5)); }
function dutyFam(m){
  const k = ds(m), p = P();
  if(p.swaps[k]) return p.swaps[k];
  const n = p.members.length;
  return p.members[((weekNo(m)%n)+n)%n];
}
// Eigenes Bestätigungsfenster statt der grauen Browser-Meldung. Liefert true (OK) oder false (Abbrechen).
function ask(text, o = {}){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'dlgbg'; bg.id = 'dlg';
    bg.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgD">
      ${o.tag ? `<span class="tag">${esc(o.tag)}</span><br>` : ''}
      <h3 id="dlgT">${esc(o.title || 'Bitte bestätigen')}</h3>
      <p id="dlgD">${esc(text)}</p>
      <div class="btns">${o.cancel === false ? '' : `<button class="alt" data-v="0">${esc(o.cancel || 'Abbrechen')}</button>`}<button class="${o.danger ? 'danger' : 'yolk'}" data-v="1">${esc(o.ok || 'OK')}</button></div></div>`;
    const key = e => { if(e.key === 'Escape') done(false); };
    const done = v => { document.removeEventListener('keydown', key); bg.remove(); resolve(v); };
    bg.addEventListener('click', e => { if(e.target === bg) done(false); });
    bg.querySelectorAll('button[data-v]').forEach(b => b.addEventListener('click', () => done(b.dataset.v === '1')));
    document.body.appendChild(bg);
    document.addEventListener('keydown', key);
    const yes = bg.querySelector('button[data-v="1"]'); if(yes && yes.focus) yes.focus();
  });
}

function stepper(id, value, min, max, extra){
  return `<div class="step"><button type="button" class="alt" onclick="stepBy('${id}',-1)" aria-label="weniger">−</button><input id="${id}" type="number" inputmode="numeric" min="${min}"${max !== undefined ? ` max="${max}"` : ''} value="${value}"${extra || ''}><button type="button" class="alt" onclick="stepBy('${id}',1)" aria-label="mehr">+</button></div>`;
}
function stepBy(id, d){
  const el = document.getElementById(id); if(!el) return;
  let v = (parseInt(el.value) || 0) + d;
  if(el.min !== '' && v < Number(el.min)) v = Number(el.min);
  if(el.max !== '' && v > Number(el.max)) v = Number(el.max);
  el.value = v; el.dispatchEvent(new Event('input'));
}

async function loadCore(){

    ok(await sb.from('projects').select('id,kind,name,settings,created_at')),

  ]);
  S.fams = f.map(x => ({id:x.id, name:x.name, uid:x.user_id, left:x.left_on, admin:x.is_admin, system:!!x.is_system}));
  const mine = f.find(x => x.user_id === S.user.id);
  S.me = mine ? mine.id : null;
  S.admin = !!(mine && mine.is_admin && !mine.left_on);
  const order = id => S.fams.findIndex(x => x.id === id);
  S.projects = pr.map(p => ({...p, settings: p.settings || {},
      members: pm.filter(m => m.project_id === p.id).map(m => m.family_id).filter(id => !(S.fams.find(x => x.id === id) || {}).system).sort((a,b)=>order(a)-order(b))}))   // Admin-Konten sehen alles, zählen aber nicht als Familie

async function dutyCheck(date, was){
  const mon = monday(parseD(date)), dutyId = dutyFam(mon);
  if(!S.me || !dutyId || dutyId === S.me) return true;                       // eigene Familie hat Dienst
  const key = `hof-dienst-ok:${today()}:${ds(mon)}`;
  if(lsGet(key)) return true;                                                   // heute schon bestätigt
  const dieseWoche = ds(mon) === ds(monday(new Date()));
  const ja = await ask(`Möchtest du trotzdem ${was}? Das ist erlaubt, im Verlauf steht dein Name.`,
    {tag: dieseWoche ? 'Dienst diese Woche' : `Dienst KW ${isoWeek(mon)}`, title: `Familie ${fam(dutyId).name} hat Dienst`, ok: `Ja, ${was}`});
  if(!ja) return false;
  lsSet(key, '1'); return true;
}

  if(navigator.vibrate) navigator.vibrate(30);

async function addLaid(n, date, manual){
  if(!(await dutyCheck(date, n > 0 ? 'zählen' : 'korrigieren'))) return;
  let undo = null;
  run(async () => {
    const p = P();
    if(n > 0){
      // jeder Klick ist ein eigener Eintrag, damit der Verlauf zeigt, wer wann gezählt hat
      await ok(await sb.from('egg_log').insert({project_id:p.id, date, type:'laid', n, auto: !manual}));
    } else if(n < 0){
      const rows = p.log.filter(l => l.type==='laid' && l.date===date).sort((x,y) => String(x.at||'').localeCompare(String(y.at||'')) || String(x.id).localeCompare(String(y.id)));
      const e = rows[rows.length-1]; if(!e) return;                    // neuester Eintrag des Tages
      if(e.n > 1){ await ok(await sb.from('egg_log').update({n:e.n-1}).eq('id', e.id)); undo = async () => ok(await sb.from('egg_log').update({n:e.n}).eq('id', e.id)); }
      else { await ok(await sb.from('egg_log').delete().eq('id', e.id)); undo = async () => ok(await sb.from('egg_log').insert({id:e.id, project_id:p.id, date:e.date, type:'laid', n:1, auto:e.auto !== false})); }
    }
  }).then(done => { if(done && undo) toastUndo(`1 Ei weniger: ${laidOn(date)} gelegt`, undo); });
}

  const inW = p.log.filter(l => isLive(l.date) && l.date >= s && l.date <= es);

async function doSale(){

    await ask(`Erhalten sind ${eur(received)}, Anzahl × Preis ergibt ${eur(expected)}. Gab es Rabatt, passe bitte den Preis pro Ei an.`, {title:'Zu wenig erhalten', ok:'OK', cancel:'Zurück'});

  }

  if(n>stock() && !(await ask(`Im Vorrat sind nur ${stock()} Eier. Möchtest du trotzdem ${n} eintragen?`, {title:'Nicht genug Eier im Vorrat', ok:'Trotzdem eintragen'}))) return;

function resizeImage(file, max = 900){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Bild konnte nicht verkleinert werden')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Das Bild konnte nicht gelesen werden')); };
    img.src = url;
  });
}

/* ================= Kalender ================= */
let planWeeks = 8;
function planMore(k){ planWeeks = Math.max(8, Math.min(104, planWeeks + k)); render(); }
const yr = d => d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
const EDIT_DAYS = 14;
const canEditDate = s => S.admin || daysSince(s) <= EDIT_DAYS;
const canEditEvent = e => S.admin || e.by === (S.user && S.user.id);
const eventsOn = s => P().events.filter(e => e.date <= s && (e.end || e.date) >= s);
const EKINDS = ['Tierarzt','Klauenpflege','Urlaub','Sonstiges'];

function vDienst(){
  return (isHens() ? '' : dutyNote()) + (isHens() ? doorCard() : suppliesCard()) + calCard() + eventsCard() + planCard();
}
function calShift(k){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+k, 1); render(); }
function calCard(){
  const p = P(), y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0), startOff = (first.getDay()+6)%7;
  const cells = [];
  for(let i=0;i<startOff;i++) cells.push(null);
  for(let d=1; d<=last.getDate(); d++) cells.push(new Date(y,m,d));
  while(cells.length % 7) cells.push(null);
  const t = today();
  const cellHtml = d => {
    if(!d) return '<div></div>';
    const s = ds(d), eggs = isHens() ? laidOn(s) : 0, evs = eventsOn(s);
    if(p.start && s < p.start) return `<button class="day" disabled style="opacity:.3" aria-label="${fmtDate(s)} (vor Beginn der Erfassung)"><span>${d.getDate()}</span></button>`;
    return `<button class="day ${s===t?'today':''}" onclick="sheetDay('${s}')" aria-label="${fmtDate(s)}"><span>${d.getDate()}</span>${eggs?`<span class="eg">${eggs}</span>`:''}${evs.length?'<span class="dot"></span>':''}</button>`;
  };
  const cur = ds(monday(new Date())), wkStart = monday(first);
  let grid = '';
  for(let r = 0; r < cells.length / 7; r++){
    const wk = new Date(wkStart); wk.setDate(wk.getDate() + 7*r);
    const we = new Date(wk); we.setDate(we.getDate() + 6);
    if(p.start && ds(we) < p.start){ grid += `<div class="wk pre"><b>KW ${isoWeek(wk)}</b></div>`; }
    else {
      const f = dutyFam(wk), nm = fam(f).name, sh = nm.length > 6 ? nm.slice(0,5) + '.' : nm;
      grid += `<button class="wk ${f===S.me?'mine':''} ${ds(wk)===cur?'cur':''}" onclick="sheetSwap('${ds(wk)}')" title="${esc(nm)}" aria-label="Kalenderwoche ${isoWeek(wk)}, Dienst ${esc(nm)}. Tippen zum Tauschen"><b>KW ${isoWeek(wk)}</b><span>${esc(sh)}</span></button>`;
    }
    grid += cells.slice(r*7, r*7 + 7).map(d => cellHtml(d)).join('');
  }
  return `
  <div class="card" style="padding:12px">
    <div class="row" style="margin-bottom:10px">
      <button class="alt small" onclick="calShift(-1)" aria-label="Voriger Monat" ${(!p.start || ds(new Date(y,m,0)) >= p.start) ? '' : 'disabled'}>‹</button>
      <h2 style="margin:0">${calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2>
      <button class="alt small" onclick="calShift(1)" aria-label="Nächster Monat">›</button>
    </div>
    <div class="cal"><div class="calh">KW</div>${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="calh">${x}</div>`).join('')}${grid}</div>
    ${info(`Tipp auf einen Tag: Einträge ansehen, ändern oder nachtragen.${isHens()?' Gelbe Zahl: gelegte Eier.':''} Blauer Punkt: Termin. Links: Kalenderwoche und Dienst (gelb = deine Familie), ein Tipp darauf tauscht den Dienst.`, 'So funktioniert der Kalender')}
  </div>`;
}

/* ================= Kasse (pro Projekt getrennt) ================= */
/* Zählt eine Einnahme schon zum Bestand? Verkäufe und Zusatz-Eier erst, wenn der Geldeingang bestätigt ist
   (Trinkgeld folgt seinem Verkauf). Manuell gebuchte Einnahmen zählen sofort. */
function countsForStock(t){
  if(t.kind !== 'einnahme') return true;
  const root = t.parent ? (P().tx.find(x => x.id === t.parent) || t) : t;
  if(!tracked(root)) return true;
  return root.state === 'bestaetigt';
}
const pendingIncome = () => sum(P().tx.filter(t => t.kind === 'einnahme' && !countsForStock(t)), t => t.amt);
function kasseStand(){
  const p = P(), k = x => sum(p.tx.filter(t => t.kind === x && (x !== 'einnahme' || countsForStock(t))), t => t.amt);
  return k('einnahme') + k('einzahlung') - k('auszahlung') - sum(p.tx.filter(t => t.kind==='ausgabe' && !t.fam), t => t.amt);
}
function balances(){
  const p = P();
  // Verteilt werden nur Ausgaben, die eine Familie bezahlt hat. Einnahmen (z. B. Eierverkauf) bleiben in der Gemeinschaftskasse.
  const share = sum(p.tx.filter(t => t.kind === 'ausgabe' && t.fam), t => t.amt) / p.members.length;
  const rows = members().map(f => ({f, bal:
      sum(p.tx.filter(t => t.kind==='ausgabe'   && t.fam===f.id), t => t.amt) - share
    + sum(p.tx.filter(t => t.kind==='einzahlung' && t.fam===f.id), t => t.amt)
    - sum(p.tx.filter(t => t.kind==='auszahlung' && t.fam===f.id), t => t.amt)}));
  rows.push({f:{id:'kasse', name:'Gemeinschaftskasse'}, bal: -kasseStand()});
  return rows;
}
const txAmt = t => t.kind==='einnahme' ? `<span class="pos">+${eur(t.amt)}</span>`
  : t.kind==='ausgabe' ? `<span class="neg">−${eur(t.amt)}</span>`
  : `<span class="muted">${t.kind==='einzahlung'?'→ Kasse':'Kasse →'} ${eur(t.amt)}</span>`;
function settlements(){
  // Alle Zahlungen laufen über die Gemeinschaftskasse: Schuldner zahlen ein, Gläubiger bekommen es aus der Kasse.
  const rows = balances().filter(x => x.f.id !== 'kasse' && Math.abs(x.bal) > 0.005);
  return [
    ...rows.filter(x => x.bal < 0).map(x => ({from:x.f.id, to:'kasse', fam:x.f.id, dir:'in',  amt:Math.round(-x.bal*100)/100})),
    ...rows.filter(x => x.bal > 0).map(x => ({from:'kasse', to:x.f.id, fam:x.f.id, dir:'out', amt:Math.round(x.bal*100)/100}))
  ].filter(x => x.amt > 0);
}
async function bookSettlement(famId, dir, amt){
  const name = fam(famId).name;
  if(dir === 'out' && kasseStand() + 0.005 < amt && !(await ask(`In der Kasse sind erst ${eur(kasseStand())}. Die Auszahlung von ${eur(amt)} trotzdem buchen?`, {title:'Kassenstand reicht noch nicht', ok:'Trotzdem buchen'}))) return;

/* ================= Zahlungsstatus, Kontrolle und Kassenabgleich ================= */
const actions2 = (ok, label) => `<div class="actions"><button class="alt" onclick="closeSheet()">Abbrechen</button><button class="yolk" onclick="${ok}">${label}</button></div>`;
const money = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
const saleLink = t => P().log.find(l => l.txId === t.id);                           // verknüpfter Eier-Eintrag (Verkauf oder Zusatz)
const tracked = t => !t.parent && t.kind === 'einnahme' && !!saleLink(t);           // Buchungen, deren Zahlung kontrolliert wird
const tipsOf = t => P().tx.filter(x => x.parent === t.id);
const payTotal = t => t.amt + sum(tipsOf(t), x => x.amt);
function sellerName(t){ const f = t.seller ? S.fams.find(x => x.id === t.seller) : famByUid(t.by); return f ? f.name : ''; }
function txMeta(t){

  if(lk && lk.type === 'sale' && who) return `verkauft von ${esc(who)}`;

  return esc(fam(t.fam).name);
}
const OVERDUE = {bar_offen:7, pruefen:3};                                    // ab wie vielen Tagen eine offene Zahlung auffällt
const ageOf = t => Math.max(0, daysSince(t.date));
const overdue = t => !!t.state && OVERDUE[t.state] !== undefined && ageOf(t) >= OVERDUE[t.state];

/* Karte „Offene Zahlungen“ */
// Was in der Kasse auf mich wartet: eigenes Bargeld einzahlen, beim Admin auch Eingänge prüfen
let chartMonth = null;
function kasseChart(){
  const p = P(), now = new Date(), months = [];
  for(let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const monthSum = (ym, kind) => sum(p.tx.filter(t => t.kind === kind && t.date.slice(0,7) === ym), t => t.amt);
  const rows = months.map(ym => ({ym, inc: monthSum(ym, 'einnahme'), exp: monthSum(ym, 'ausgabe')}));
  const max = Math.max(...rows.map(r => Math.max(r.inc, r.exp)));
  if(!(max > 0)) return '';
  const sel = rows.find(r => r.ym === chartMonth) || rows[rows.length - 1];
  const h = v => v > 0 ? Math.max(2, Math.round(v / max * 100)) : 0;
  const short = ym => new Date(ym + '-01T12:00:00').toLocaleDateString('de-DE', {month:'short'});

  <div class="card">
    <h2><span class="hi" aria-hidden="true">📊</span>Einnahmen und Ausgaben</h2>
    <div class="mbars">${rows.map(r => `<button class="mb ${r.ym === sel.ym ? 'on' : ''}" onclick="chartMonth='${r.ym}';render()" aria-label="${monthName(r.ym)}: Einnahmen ${eur(r.inc)}, Ausgaben ${eur(r.exp)}">
      <div class="mbb"><i class="c-in" style="height:${h(r.inc)}%"></i><i class="c-out" style="height:${h(r.exp)}%"></i></div><span>${short(r.ym)}</span></button>`).join('')}</div>
    <div class="legend"><span><i class="c-in"></i>Einnahmen</span><span><i class="c-out"></i>Ausgaben</span></div>

}
function kasseTodo(){

function openPayCard(){
  const tr = P().tx.filter(tracked);
  const open = tr.filter(t => t.state && t.state !== 'bestaetigt'), legacy = tr.filter(t => !t.state);
  if(!open.length && !legacy.length) return '';
  const cash = {}, oldest = {};
  open.filter(t => t.state === 'bar_offen').forEach(t => { const n = sellerName(t) || 'Familie'; cash[n] = (cash[n] || 0) + payTotal(t); oldest[n] = Math.max(oldest[n] || 0, ageOf(t)); });
  const pend = open.filter(t => t.state === 'pruefen'), me = (S.fams.find(f => f.id === S.me) || {}).name;
  const late = open.some(overdue), pendOld = Math.max(0, ...pend.map(ageOf));
  const lines = [
    ...Object.entries(cash).map(([n, v]) => `<div${n === me ? ' style="font-weight:600"' : ''}>Bargeld bei ${esc(n)}${n === me ? ' (du)' : ''}: ${eur(v)} noch einzuzahlen${oldest[n] >= OVERDUE.bar_offen ? ` <span class="neg">(seit ${oldest[n]} Tagen)</span>` : ''}</div>`),
    pend.length ? `<div>${pend.length === 1 ? '1 PayPal-Eingang' : pend.length + ' PayPal-Eingänge'} (${eur(sum(pend, payTotal))}) ${S.admin ? 'noch zu prüfen' : 'prüft noch der Admin'}${pendOld >= OVERDUE.pruefen ? ` <span class="neg">(älteste seit ${pendOld} Tagen)</span>` : ''}</div>` : '',

  </div>`;

async function doPayConfirm(id){

/* Kassenabgleich: echter PayPal-Kontostand gegen den Bestand der Gemeinschaftskasse */

}
function checkCard(){

  </div>`;
}
function sheetCheck(){

    <div class="list" style="margin-top:8px">

/* ================= Monatsbericht zum Teilen ================= */
function monthOptions(){ const out = [], d = new Date(); d.setDate(1); for(let i = 0; i < 12; i++){ out.push(ds(d).slice(0, 7)); d.setMonth(d.getMonth() - 1); } return out; }
const monthName = ym => new Date(ym + '-01T12:00').toLocaleDateString('de-DE', {month:'long', year:'numeric'});
function reportText(ym){
  const p = P(), inM = d => d.slice(0, 7) === ym, lg = ty => p.log.filter(l => l.type === ty && inM(l.date));
  const laid = sum(lg('laid'), l => l.n), take = sum(lg('take'), l => l.n), sold = sum(lg('sale'), l => l.n), extra = sum(lg('zusatz'), l => l.n);
  const inc = sum(p.tx.filter(t => t.kind === 'einnahme' && inM(t.date)), t => t.amt), exp = sum(p.tx.filter(t => t.kind === 'ausgabe' && inM(t.date)), t => t.amt);
  const first = new Date(ym + '-01T12:00'), last = new Date(first.getFullYear(), first.getMonth() + 1, 0), now = new Date();
  const days = now < first ? 0 : (ds(now).slice(0, 7) === ym ? now.getDate() : last.getDate());
  const c = checkParts(), pend = pendingIncome();

function qrMatrix(text){

}

(function(){
  const el = document.getElementById('ptr'); let y0 = 0, on = false, dist = 0, busy = false;
  const show = (t, d) => { el.textContent = t; el.style.opacity = Math.min(1, d/50); el.style.transform = `translate(-50%,${Math.min(d,110)*0.55-50}px)`; };
  const hide = () => { el.style.opacity = 0; el.style.transform = 'translate(-50%,-60px)'; };
  document.addEventListener('touchstart', e => {
    if(busy || !S.p || document.getElementById('sheet') || e.touches.length !== 1 || window.scrollY > 0){ on = false; return; }
    y0 = e.touches[0].clientY; on = true; dist = 0;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!on) return; const dy = e.touches[0].clientY - y0;
    if(dy <= 0){ dist = 0; hide(); return; }
    dist = dy; show(dy >= 80 ? 'Loslassen zum Aktualisieren' : 'Zum Aktualisieren ziehen', dy);
  }, {passive:true});
  document.addEventListener('touchend', async () => {
    if(!on) return; on = false;
    if(dist >= 80){ busy = true; show('Aktualisiere …', 120); if(tab === 'admin') adm.data = null; await enqueue(async () => { await loadProject(); render(); toast('Aktualisiert'); }); busy = false; }
    hide(); dist = 0;
  });
})();

/* ================= Push-Nachrichten (neue Bestellungen) ================= */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
let push = {state:'unbekannt', reminders:true};
function urlB64ToUint8(b){
  const pad = '='.repeat((4 - b.length % 4) % 4), raw = atob((b + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function currentSub(){
  if(!('serviceWorker' in navigator)) return null;
  const reg = await navigator.serviceWorker.getRegistration('/');
  return reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
}
async function refreshPushState(){
  try{
    if(!('serviceWorker' in navigator) || !window.isSecureContext) push.state = 'nicht-unterstuetzt';
    else if(!pushSupported()) push.state = (isIOS() && !isStandalone()) ? 'ios-installieren' : 'nicht-unterstuetzt';
    else if(Notification.permission === 'denied') push.state = 'blockiert';
    else {
      const sub = Notification.permission === 'granted' ? await currentSub() : null;
      push.state = sub ? 'an' : 'aus';

async function loadAudit(reset){
  if(reset) audit = {rows:[], done:false, open:true};
  try{
    const from = audit.rows.length;
    const rows = await ok(await sb.from('audit_log').select('*').eq('project_id', S.cur).order('changed_at', {ascending:false}).range(from, from+24));
    audit.rows = audit.rows.concat(rows);

  }catch(e){ toast('Fehler: ' + (e.message || e)); }
  render();
}

let adm = {data:null, loading:false, err:'', prev:null, prevDate:'', prevBusy:false};
async function loadAdmin(){
  adm.loading = true; adm.err = '';
  try{ adm.data = await ok(await sb.rpc('admin_overview')); }
  catch(e){ adm.err = e.message || String(e); }
  adm.loading = false;
  if(tab === 'admin') render();
}
async function adminCall(payload){
  const {data:{session}} = await sb.auth.getSession();
  const r = await fetch(CONFIG.url + '/functions/v1/notify-order', {method:'POST', headers:{'Content-Type':'application/json', apikey:CONFIG.key, Authorization:'Bearer ' + session.access_token}, body: JSON.stringify(payload)});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ('Fehler ' + r.status));
  return j;
}
// „heute 14:32“, „gestern 09:10“, „Mi 21.10., 08:15 (vor 4 Tagen)“
function agoText(iso){
  if(!iso) return '–';
  const d = new Date(iso), days = Math.round((parseD(today()) - parseD(ds(d))) / 864e5);
  const t = d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  if(days === 0) return 'heute ' + t;
  if(days === 1) return 'gestern ' + t;
  return d.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'}) + ', ' + t + ` (vor ${days} Tagen)`;
}
const agoDays = iso => iso ? Math.round((parseD(today()) - parseD(ds(new Date(iso)))) / 864e5) : null;
const latest = (...xs) => xs.filter(Boolean).sort().pop() || null;
function vAdmin(){
  if(!S.admin) return '';
  if(!adm.data && !adm.loading && !adm.err) loadAdmin();
  const wait = adm.err ? `<div class="card"><p class="neg" style="margin:0">Übersicht konnte nicht geladen werden: ${esc(adm.err)}</p><button class="alt small" style="margin-top:10px" onclick="adm.err='';render()">Noch einmal</button></div>`
    : !adm.data ? '<div class="card"><p class="muted" style="margin:0">Übersicht wird geladen …</p></div>' : '';
  return `${wait}
  ${adm.data ? admOpenCard() + admFamCard() : ''}
  ${admNoticeCard()}
  ${admMessageCard()}
  ${adm.data ? admReminderCard() : ''}
  ${isHens() ? admNeighborCard() + admQualityCard() : ''}
  ${settingsCard()}
  ${famCard()}
  ${dataCard()}`;
}

/* Alles Offene auf einen Blick (beide Projekte) */
function admOpenCard(){
  const row = (label, value, bad) => `<div class="item"><span>${label}</span><span class="${bad ? 'neg' : ''}" style="text-align:right">${value}</span></div>`;
  const block = p => {
    const pr = p.pruefen || {n:0, sum:0}, bar = p.bar || [];
    const ck = agoDays(p.last_check), bk = p.last_backup ? daysSince(p.last_backup) : null;
    const dutyEnd = p.duty_end ? parseD(p.duty_end) : null, dutyLeft = dutyEnd ? Math.round((dutyEnd - parseD(today())) / 864e5) : null;
    if(dutyEnd) dutyEnd.setDate(dutyEnd.getDate() + 6);
    return `<h2 style="font-size:17px;margin:14px 0 4px">${p.kind === 'goats' ? '🐐' : '🐔'} ${esc(p.name)}</h2>
      ${row('PayPal-Eingänge prüfen', pr.n ? `${pr.n} · ${eur(Number(pr.sum))}${pr.oldest ? ` · seit ${fmtDay(parseD(pr.oldest))}` : ''}` : 'keine', pr.n && pr.oldest && daysSince(pr.oldest) >= OVERDUE.pruefen)}
      ${row('Bargeld bei Familien', bar.length ? bar.map(b => `${esc(b.name)} ${eur(Number(b.sum))}`).join('<br>') : 'keins', bar.some(b => b.oldest && daysSince(b.oldest) >= OVERDUE.bar_offen))}
      ${p.kind === 'hens' ? row('Offene Bestellungen', p.orders ? `${p.orders}${p.orders_oldest ? ` · älteste ${agoText(p.orders_oldest)}` : ''}` : 'keine', p.orders && agoDays(p.orders_oldest) >= 3) : ''}
      ${row('Kassenabgleich', p.last_check ? agoText(p.last_check) : 'noch nie', ck === null || ck > 31)}
      ${row('Sicherung', p.last_backup ? fmtDate(p.last_backup) + (bk ? ` (vor ${bk} Tagen)` : '') : 'noch nie', bk === null || bk >= 31)}
      ${row('Dienstplan eingetragen bis', dutyEnd ? fmtDate(ds(dutyEnd)) : 'nicht eingetragen', dutyLeft === null || dutyLeft < 56)}`;
  };
  return `<div class="card list">
    <div class="row"><h2 style="margin:0"><span class="hi" aria-hidden="true">📋</span>Offen auf einen Blick</h2><button class="ghost" onclick="adm.data=null;render()" aria-label="Neu laden">↻</button></div>
    ${adm.data.projects.map(block).join('')}
    ${info('Rot heißt: überfällig. PayPal-Eingänge ab 3 Tagen, Bargeld ab 7 Tagen, Bestellungen ab 3 Tagen, Kassenabgleich und Sicherung nach einem Monat, Dienstplan, wenn er in weniger als 8 Wochen endet.')}
  </div>`;
}

/* Erinnerungen: Zeitplan, letzte Läufe, Vorschau */
function admReminderCard(){
  const calls = adm.data.calls || [], runs = adm.data.runs || [];
  const last = calls[0], late = !last || (Date.now() - new Date(last.at)) > 2 * 3600e3, bad = last && last.status !== 200;
  const runText = r => { const x = r.result || {}; return r.kind === 'fehler' ? `<span class="neg">Fehler: ${esc(x.error || '?')}</span>` : `${x.users || 0} ${x.users === 1 ? 'Familie' : 'Familien'}, ${x.sent || 0} zugestellt${x.failed ? `, <span class="neg">${x.failed} fehlgeschlagen</span>` : ''}${x.gone ? `, ${x.gone} Geräte abgemeldet` : ''}${x.force ? ' (Test)' : ''}`; };
  const pv = adm.prev;
  return `<div class="card list">
    <h2><span class="hi" aria-hidden="true">⏰</span>Erinnerungen</h2>
    <p style="margin:0 0 6px" class="${late || bad ? 'neg' : ''}">${!last ? 'Kein Aufruf des Zeitplans in den letzten Stunden gefunden.' : bad ? `Letzter Aufruf ${agoText(last.at)} mit Fehler ${last.status || ''} ${esc(last.error || '')}` : late ? `Letzter Aufruf des Zeitplans: ${agoText(last.at)}. Er sollte jede Stunde laufen.` : `✓ Der Zeitplan läuft (letzter Aufruf ${agoText(last.at)}).`}</p>
    <h2 style="font-size:17px;margin:12px 0 4px">Letzte Läufe um 18 Uhr</h2>
    ${runs.length ? runs.slice(0, 5).map(r => `<div class="item" style="align-items:flex-start"><span>${agoText(r.at)}</span><span style="text-align:right;font-size:14px">${runText(r)}</span></div>`).join('') : '<p class="muted" style="margin:0">Noch kein Lauf protokolliert. Das Protokoll gibt es seit dem 25.10.2026.</p>'}
    <h2 style="font-size:17px;margin:16px 0 4px">Vorschau</h2>
    <p class="muted" style="margin:0 0 8px">Zeigt, welche Erinnerungen an diesem Tag um 18 Uhr rausgehen würden. Es wird nichts an die Familien gesendet.</p>
    <input type="date" id="pvd" value="${adm.prevDate || today()}" onchange="adm.prevDate=this.value">
    <div class="grid2" style="margin-top:10px"><button class="alt" onclick="admPreview(false)" ${adm.prevBusy ? 'disabled' : ''}>Vorschau anzeigen</button><button class="alt" onclick="admPreview(true)" ${adm.prevBusy ? 'disabled' : ''}>An mich senden</button></div>
    ${pv ? `<p class="muted" style="margin:12px 0 0">Für ${fmtDate(pv.date)}:</p>${pv.messages.length ? pv.messages.map(m => `<div class="item" style="align-items:flex-start;flex-direction:column;gap:2px"><strong>${esc(m.name)}: ${esc(m.title)}</strong><span style="font-size:14px;white-space:pre-line">${esc(m.body)}</span></div>`).join('') : '<p style="margin:4px 0 0">Keine Erinnerungen an diesem Tag.</p>'}` : ''}
  </div>`;
}
async function admPreview(send){
  const d = (document.getElementById('pvd') || {}).value || today();
  adm.prevDate = d; adm.prevBusy = true; render();
  try{
    adm.prev = await adminCall({admin:'preview', date:d, send});
    if(send) toast(!adm.prev.messages.length ? 'An diesem Tag gibt es keine Erinnerungen' : adm.prev.sent > 0 ? `${adm.prev.messages.length} ${adm.prev.messages.length === 1 ? 'Erinnerung' : 'Erinnerungen'} an dich gesendet` : 'Auf deinem Gerät sind keine Benachrichtigungen eingeschaltet');
  }catch(e){ toast('Fehler: ' + (e.message || e)); }
  adm.prevBusy = false; render();
}

  return `<div class="card">
    <h2><span class="hi" aria-hidden="true">✉️</span>Nachricht an eine Familie</h2>
    <p class="muted" style="margin:0 0 8px">Schickt eine Benachrichtigung auf alle Handys der Familie, auf denen sie eingeschaltet ist. So prüfst du, ob Nachrichten ankommen.</p>
    <select id="amf">${fams.map(f => `<option value="${f.id}">${esc(f.name)}${f.id === S.me ? ' (du)' : ''}</option>`).join('')}</select>
    <textarea id="amt" rows="3" maxlength="300" style="margin-top:10px"></textarea>
    <button class="yolk" style="width:100%;margin-top:10px" onclick="admSend()">Nachricht senden</button>
  </div>`;
}
async function admSend(){
  const fid = val('amf'), text = val('amt').trim();
  if(!text){ toast('Bitte einen Text eingeben'); return; }
  try{
    const r = await adminCall({admin:'message', family_id:fid, text});
    toast(r.sent > 0 ? `Gesendet an ${fam(fid).name} (${r.sent} ${r.sent === 1 ? 'Gerät' : 'Geräte'})` : r.total > 0 ? 'Zustellung gerade nicht möglich, bitte später noch einmal' : `${fam(fid).name} hat keine Benachrichtigungen eingeschaltet`);
    if(r.sent > 0) document.getElementById('amt').value = '';
  }catch(e){ toast('Fehler: ' + (e.message || e)); }
}

/* Hinweis an alle Familien des Projekts: oben in der App und als Benachrichtigung */
const noticeOf = () => { const n = (S.projects.find(x => x.id === S.cur) || {settings:{}}).settings.notice; return n && n.text ? n : null; };
const noticeActive = n => !!n && (!n.until || today() <= n.until);
function noticeBanner(){
  const n = noticeOf();
  if(!noticeActive(n) || lsGet(`hof-hinweis:${S.cur}:${n.at}`)) return '';
  return `<div class="card dutynote"><div class="row" style="align-items:flex-start"><div><strong><span aria-hidden="true">📣</span> Hinweis</strong><p style="margin:4px 0 0;white-space:pre-line">${esc(n.text)}</p></div><button class="ghost" onclick="noticeHide()" aria-label="Hinweis ausblenden">✕</button></div></div>`;
}
function noticeHide(){ const n = noticeOf(); if(n) lsSet(`hof-hinweis:${S.cur}:${n.at}`, '1'); render(); }
function admNoticeCard(){
  const n = noticeOf();
  return `<div class="card">
    <h2><span class="hi" aria-hidden="true">📣</span>Hinweis an alle (${projLabel(P())})</h2>
    <p class="muted" style="margin:0 0 8px">Erscheint bei allen Familien ${isHens() ? 'der Hühner' : 'der Ziegen'} oben in der App, bis sie ihn mit ✕ ausblenden oder er abläuft. Auf Wunsch auch als Benachrichtigung.</p>
    ${n ? `<p style="margin:0 0 8px;font-size:14px" class="${noticeActive(n) ? '' : 'muted'}">${noticeActive(n) ? 'Aktiv' : 'Abgelaufen'} seit ${agoText(n.at)}${n.until ? `, bis ${fmtDate(n.until)}` : ''}</p>` : ''}
    <textarea id="ntx" rows="3" maxlength="300">${esc(n ? n.text : '')}</textarea>
    <label class="muted" style="display:block;margin-top:10px">Anzeigen bis (leer = bis du ihn entfernst)</label>
    <input type="date" id="nun" value="${n && n.until ? n.until : ''}">
    <label style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:16px"><input type="checkbox" id="npu" checked style="width:auto;margin:0"> Auch als Benachrichtigung senden</label>
    <div class="grid2" style="margin-top:10px">${n ? '<button class="alt" onclick="admNoticeClear()">Entfernen</button>' : '<span></span>'}<button class="yolk" onclick="admNoticeSave()">Veröffentlichen</button></div>
  </div>`;
}
async function admNoticeSave(){
  const text = val('ntx').trim(), until = val('nun') || null, pushIt = document.getElementById('npu').checked;
  if(!text){ toast('Bitte einen Text eingeben'); return; }
  if(until && until < today()){ toast('Das Datum liegt in der Vergangenheit'); return; }
  const proj = S.projects.find(x => x.id === S.cur);
  const done = await run(async () => ok(await sb.from('projects').update({settings:{...proj.settings, notice:{text, at:new Date().toISOString(), until}}}).eq('id', proj.id)), 'Hinweis veröffentlicht');
  if(done && pushIt){
    try{ const r = await adminCall({admin:'notice', project_id:proj.id}); toast(`Hinweis veröffentlicht, Benachrichtigung an ${r.sent} ${r.sent === 1 ? 'Gerät' : 'Geräte'}`); }
    catch(e){ toast('Hinweis gespeichert, Benachrichtigung fehlgeschlagen: ' + (e.message || e)); }
  }
}
async function admNoticeClear(){
  if(!(await ask('Der Hinweis verschwindet bei allen Familien.', {title:'Hinweis entfernen?', ok:'Entfernen', danger:true}))) return;
  const proj = S.projects.find(x => x.id === S.cur), st = {...proj.settings}; delete st.notice;
  run(async () => ok(await sb.from('projects').update({settings:st}).eq('id', proj.id)), 'Hinweis entfernt');
}

/* Nachbar-Statistik (letzte 6 Monate) */
const buyerKey = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
function neighborStats(){
  const p = P(), d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth() - 5);
  const from = ds(d0), months = [];
  for(let i = 0; i < 6; i++){ const d = new Date(d0); d.setMonth(d0.getMonth() + i); months.push(ds(d).slice(0, 7)); }
  const sales = p.log.filter(l => l.type === 'sale' && l.date >= from);
  const orders = (p.orders || []).filter(o => o.created.slice(0, 10) >= from);
  const byMonth = months.map(ym => {
    const s = sales.filter(l => l.date.startsWith(ym)), o = orders.filter(x => ds(new Date(x.created)).startsWith(ym));
    return {ym, eggs: sum(s, l => l.n), money: sum(s, l => l.n * (l.price || 0)), sales: s.length,
      orders: o.length, done: o.filter(x => x.status === 'erledigt').length, rejected: o.filter(x => x.status === 'abgelehnt').length};
  });
  const cust = {};
  sales.forEach(l => { const k = buyerKey(l.buyer); if(!k) return; const c = cust[k] = cust[k] || {name: String(l.buyer).trim(), n:0, eggs:0, orders:0}; c.n++; c.eggs += l.n; });
  orders.forEach(o => { const k = buyerKey(o.buyer); if(!k) return; const c = cust[k] = cust[k] || {name: String(o.buyer).trim(), n:0, eggs:0, orders:0}; c.orders++; });
  const sellers = {};
  sales.forEach(l => { const t = l.txId ? p.tx.find(x => x.id === l.txId) : null; const f = (t && t.seller && S.fams.find(x => x.id === t.seller)) || famByUid(l.by) || (l.fam && fam(l.fam)); const name = f ? f.name : '?'; const x = sellers[name] = sellers[name] || {n:0, eggs:0, money:0}; x.n++; x.eggs += l.n; x.money += l.n * (l.price || 0); });
  return {byMonth, customers: Object.values(cust).sort((a, b) => b.eggs - a.eggs || b.orders - a.orders), sellers: Object.entries(sellers).sort((a, b) => b[1].eggs - a[1].eggs)};
}
let nbStatOpen = false;
function admNeighborCard(){
  const st = nbStatOpen ? neighborStats() : null;
  const mn = ym => new Date(ym + '-01T12:00').toLocaleDateString('de-DE', {month:'short', year:'2-digit'});
  return `<details class="card list" ${nbStatOpen ? 'open' : ''} ontoggle="if(nbStatOpen!==this.open){nbStatOpen=this.open;render();}">
    <summary><h2 style="margin:0"><span class="hi" aria-hidden="true">🏡</span>Nachbar-Statistik</h2><span class="muted" style="font-size:14px">6 Monate</span></summary>
    ${st ? `<h2 style="font-size:17px;margin:14px 0 4px">Je Monat</h2>
    ${st.byMonth.slice().reverse().map(m => `<div class="item" style="align-items:flex-start"><span>${mn(m.ym)}</span><span style="text-align:right;font-size:14px">${m.eggs} Eier verkauft (${m.sales}×), ${eur(m.money)}<br><span class="muted">${m.orders} ${m.orders === 1 ? 'Bestellung' : 'Bestellungen'}${m.orders ? `: ${m.done} erledigt, ${m.rejected} abgelehnt${m.orders - m.done - m.rejected ? `, ${m.orders - m.done - m.rejected} offen` : ''}` : ''}</span></span></div>`).join('')}
    <h2 style="font-size:17px;margin:14px 0 4px">Stammkunden</h2>
    ${st.customers.length ? st.customers.slice(0, 10).map(c => `<div class="item"><span>${esc(c.name)}</span><span style="text-align:right;font-size:14px">${[c.n ? `${c.eggs} Eier, ${c.n}× gekauft` : '', c.orders ? `${c.orders}× bestellt` : ''].filter(Boolean).join(', ')}</span></div>`).join('') : '<p class="muted" style="margin:0">Noch keine Verkäufe.</p>'}
    <h2 style="font-size:17px;margin:14px 0 4px">Verkauft von</h2>
    ${st.sellers.length ? st.sellers.map(([name, x]) => `<div class="item"><span>${esc(name)}</span><span style="text-align:right;font-size:14px">${x.eggs} Eier (${x.n}×), ${eur(x.money)}</span></div>`).join('') : '<p class="muted" style="margin:0">Noch keine Verkäufe.</p>'}
    ${info('Stammkunden erkennt die App am eingetippten Namen. Unterschiedliche Schreibweisen (z. B. „Meier“ und „Fam. Meier“) zählen getrennt.')}` : ''}
  </details>`;
}

/* Datenqualität (letzte 8 Wochen) */
function qualityIssues(){
  const p = P(), out = [], start = new Date(); start.setDate(start.getDate() - 56);
  let d = ds(start); if(p.start && d < p.start) d = p.start;
  const end = today();
  for(let x = parseD(d); ds(x) < end; x.setDate(x.getDate() + 1)){
    const s = ds(x), n = laidOn(s), h = hensOn(s);
    if(n === 0) out.push({date:s, text:'keine Eier eingetragen'});
    else if(n < h / 2) out.push({date:s, text:`nur ${n} ${n === 1 ? 'Ei' : 'Eier'} bei ${h} Hennen`});
    else if(n > h) out.push({date:s, text:`${n} Eier bei nur ${h} Hennen`});
  }
  const noState = p.tx.filter(t => tracked(t) && !t.state);
  const oldOrders = openOrders().filter(o => agoDays(o.created) >= 7);
  return {days: out.reverse(), noState, oldOrders};
}
let qualOpen = false;
function admQualityCard(){
  const q = qualOpen ? qualityIssues() : null;
  return `<details class="card list" ${qualOpen ? 'open' : ''} ontoggle="if(qualOpen!==this.open){qualOpen=this.open;render();}">
    <summary><h2 style="margin:0"><span class="hi" aria-hidden="true">🔍</span>Datenqualität</h2><span class="muted" style="font-size:14px">8 Wochen</span></summary>
    ${q ? `<h2 style="font-size:17px;margin:14px 0 4px">Auffällige Tage</h2>
    ${q.days.length ? q.days.map(x => `<div class="item"><span>${parseD(x.date).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'})}</span><span style="display:flex;align-items:center;gap:8px;font-size:14px">${x.text}<button class="alt small" onclick="sheetDay('${x.date}')">Ansehen</button></span></div>`).join('') : '<p class="muted" style="margin:0">Keine auffälligen Tage.</p>'}
    <h2 style="font-size:17px;margin:14px 0 4px">Verkäufe ohne Zahlungsstand</h2>
    ${q.noState.length ? q.noState.map(t => `<div class="item"><span>${fmtDay(parseD(t.date))} · ${esc(t.desc || 'Einnahme')}</span><span class="pos">${eur(t.amt)}</span></div>`).join('') + '<p class="muted" style="margin:6px 0 0;font-size:14px">Nachtragen in der Kasse mit „Erfassen“.</p>' : '<p class="muted" style="margin:0">Alle Verkäufe haben einen Zahlungsstand.</p>'}
    ${q.oldOrders.length ? `<h2 style="font-size:17px;margin:14px 0 4px">Bestellungen älter als 7 Tage</h2>${q.oldOrders.map(o => `<div class="item"><span>${esc(o.buyer)}</span><span style="font-size:14px">${o.qty} Eier, ${agoText(o.created)}</span></div>`).join('')}` : ''}
    ${info('Auffällig ist ein Tag ohne Eier, mit weniger Eiern als die Hälfte der Hennen oder mit mehr Eiern als Hennen. Bis KW 41 sind die Tageswerte aus Wochensummen verteilt. Mit „Ansehen“ öffnest du den Tag und kannst Eier nachtragen oder korrigieren.')}` : ''}
  </details>`;
}
function settingsCard(){
  const p = P();
  return `
  ${S.admin ? `<details class="card" ${setOpen?'open':''} ontoggle="setOpen=this.open">
    <summary><h2 style="margin:0"><span class="hi" aria-hidden="true">⚙️</span>Einstellungen</h2><span class="pill">nur Admin</span></summary>
  ${isHens() ? `<div>
    <h2 style="font-size:17px;margin:18px 0 8px">Stall</h2>
    <label class="muted" style="display:block">Hennenbestand (die Legeleistung rechnet mit dem Bestand am jeweiligen Tag)</label>
    <div class="list" style="margin-top:4px">${p.hensHist.map(h => `<div class="item"><span>ab ${fmtDate(h.from)}</span><strong>${h.n} Hennen</strong></div>`).join('')}</div>
    <button class="alt small" style="margin-top:6px" onclick="sheetHens()">Bestand ändern</button>

    <input type="text" inputmode="decimal" placeholder="automatisch" value="${typeof p.priceIntern==='number' ? String(p.priceIntern).replace('.',',') : ''}" onchange="const v=this.value.trim();saveSetting({price_intern:v===''?null:num(v)})">
    <label class="muted" style="display:block;margin-top:10px">Preis pro Ei für Nachbarn, extern (€)</label>
    <input type="text" inputmode="decimal" value="${String(p.price).replace('.',',')}" onchange="saveSetting({price_extern:num(this.value)})">
  </div>` : ''}
  <div>
    <h2 style="font-size:17px;margin:18px 0 8px">Zahlung</h2>
    <label class="muted" style="display:block">PayPal.me-Name oder Link (für den Zahlungs-QR-Code in der Kasse)</label>
    <input type="text" value="${esc(p.paypal)}" onchange="saveSetting({paypal_me:normPaypal(this.value)||null})">
    ${p.paypal ? `<p style="margin:10px 0 0"><strong>${esc(paypalLink(p.paypal, 0).replace('https://', ''))}</strong></p>
    <button class="alt small" style="margin-top:8px" onclick="sheetPayLink()">Link anzeigen, kopieren, teilen</button>` : ''}
  </div>
  <div>
    <h2 style="font-size:17px;margin:18px 0 8px">Erfassung</h2>
    <label class="muted" style="display:block">Die App zählt Daten ab diesem Datum</label>
    <input type="date" value="${p.start}" onchange="saveSetting({start_date:this.value||null})">
    <p class="muted" style="margin:8px 0 0">Der Kalender, die Wochenübersicht und die Nachträge beginnen an diesem Tag. Frühere Einträge bleiben in der Datenbank erhalten.</p>
    ${isHens() ? `<label class="muted" style="display:block;margin-top:12px">Vorrat, Überschuss und Eierpreis zählen ab (Live-Start)</label>
    <input type="date" value="${p.live}" onchange="saveSetting({live_start:this.value||null})">
    <p class="muted" style="margin:8px 0 0">Eier davor zählen nur für die Statistik. Sie landen nicht im Vorrat und nicht im Überschuss.</p>` : ''}
  </div>
  </details>` : ''}`;
}
function dataCard(){
  return `
  ${S.admin ? `<div class="card">
    <h2><span class="hi" aria-hidden="true">💾</span>Daten</h2>
    <p class="muted" style="margin-top:0">Alle Familien dieses Projekts sehen dieselben Daten. Mit „Sichern“ speicherst du eine Kopie als Datei.</p>
    ${(() => { const b = backupInfo(); return `<p style="margin:0 0 10px;font-size:14px" class="${b.late ? 'neg' : 'muted'}">${b.d ? `Letzte Sicherung: ${fmtDay(parseD(b.d))}${b.days >= 31 ? ` (vor ${b.days} Tagen, Zeit für eine neue)` : ''}` : 'Noch keine Sicherung gemacht. Bitte jetzt eine speichern.'}</p>`; })()}
    <button class="alt" style="width:100%" onclick="exportData()">Sichern</button>
  </div>` : ''}`;
}
